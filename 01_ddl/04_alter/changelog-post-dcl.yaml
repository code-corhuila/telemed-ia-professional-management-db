databaseChangeLog:
  # DEC-005 (telemed-ia-docs, 04-professional-service/decisions.md): every
  # professional is a general practitioner and there is no specialty catalog.
  - changeSet:
      id: ddl-alter-019
      author: telemed
      comment: "DEC-005: drop professional.specialty_id with its foreign key and index."
      # The rollback re-creates idx_professional_specialty_id CONCURRENTLY,
      # which cannot run inside a transaction block.
      runInTransaction: false
      changes:
        - sqlFile:
            path: 019_drop_professional_specialty.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/019_drop_professional_specialty.rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: ddl-alter-020
      author: telemed
      comment: "DEC-005: drop the specialty catalog and its seed ownership ledger."
      changes:
        - sqlFile:
            path: 020_drop_specialty_catalog.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/020_drop_specialty_catalog.rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: ddl-alter-021
      author: telemed
      comment: "DEC-005: every professional is a GENERAL_PRACTITIONER; the type is required and defaults to it."
      changes:
        - sqlFile:
            path: 021_make_professionals_general_practitioners.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/021_make_professionals_general_practitioners.rollback.sql
            relativeToChangelogFile: true
  # DEC-006 (telemed-ia-docs, 04-professional-service/decisions.md): identifiers
  # are UUID. Expand (022, 023), contract (024) and validation (025).
  - changeSet:
      id: ddl-alter-022
      author: telemed
      comment: "DEC-006 expand: add and fill the UUID identifier columns with a reversible mapping."
      changes:
        - sqlFile:
            path: 022_add_uuid_identifier_columns.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/022_add_uuid_identifier_columns.rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: ddl-alter-023
      author: telemed
      comment: "DEC-006: index the UUID idempotency column CONCURRENTLY before the swap."
      # CREATE and DROP INDEX CONCURRENTLY cannot run inside a transaction block.
      runInTransaction: false
      changes:
        - sqlFile:
            path: 023_index_uuid_idempotency_professional.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/023_index_uuid_idempotency_professional.rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: ddl-alter-024
      author: telemed
      comment: "DEC-006 contract: swap the UUID identifiers in; new professionals get gen_random_uuid()."
      changes:
        - sqlFile:
            path: 024_swap_in_uuid_identifiers.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/024_swap_in_uuid_identifiers.rollback-guard.sql
            relativeToChangelogFile: true
            splitStatements: false
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/024_swap_in_uuid_identifiers.rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: ddl-alter-025
      author: telemed
      comment: "DEC-006: validate fk_idempotency_key_professional added NOT VALID by ddl-alter-024."
      changes:
        - sqlFile:
            path: 025_validate_uuid_idempotency_key_fk.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/025_validate_uuid_idempotency_key_fk.rollback.sql
            relativeToChangelogFile: true
  # DEC-010 (telemed-ia-docs, 04-professional-service/decisions.md): the list goes
  # from the most recently registered profile to the oldest.
  - changeSet:
      id: ddl-alter-026
      author: telemed
      comment: "DEC-010: add professional.created_at, filled from the registration key or the migration time."
      changes:
        - sqlFile:
            path: 026_add_professional_created_at.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/026_add_professional_created_at.rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: ddl-alter-027
      author: telemed
      comment: "DEC-010: index the list order (created_at DESC, id DESC) CONCURRENTLY."
      # CREATE and DROP INDEX CONCURRENTLY cannot run inside a transaction block.
      runInTransaction: false
      changes:
        - sqlFile:
            path: 027_index_professional_created_at.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/027_index_professional_created_at.rollback.sql
            relativeToChangelogFile: true

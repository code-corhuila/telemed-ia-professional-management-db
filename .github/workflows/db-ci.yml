name: Database CI

on:
  pull_request:
    branches: [develop, qa, main]
  push:
    branches: [develop, qa, main]

jobs:
  rebuild:
    name: Rebuild from empty database
    runs-on: ubuntu-latest
    env:
      TEST_DB_USER: test_user
      COMPOSE_PROJECT_NAME: professional-db-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate disposable database password
        id: db_password
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"

      - name: Start PostgreSQL
        env:
          TEST_DB_PASSWORD: ${{ steps.db_password.outputs.password }}
        run: docker compose -f docker-compose.test.yml up -d postgres

      - name: Wait for PostgreSQL
        env:
          TEST_DB_PASSWORD: ${{ steps.db_password.outputs.password }}
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.test.yml exec -T postgres \
                 pg_isready -U "$TEST_DB_USER" -d professional_management_test; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      - name: Liquibase update (fresh)
        env:
          TEST_DB_PASSWORD: ${{ steps.db_password.outputs.password }}
        run: docker compose -f docker-compose.test.yml run --rm liquibase update

      - name: Record fresh changeset count
        id: fresh_count
        env:
          TEST_DB_PASSWORD: ${{ steps.db_password.outputs.password }}
        run: |
          count=$(docker compose -f docker-compose.test.yml exec -T postgres \
            psql -U "$TEST_DB_USER" -d professional_management_test -tAc \
            "SELECT count(*) FROM databasechangelog")
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Liquibase update (must apply zero changesets)
        env:
          TEST_DB_PASSWORD: ${{ steps.db_password.outputs.password }}
        run: |
          before=$(docker compose -f docker-compose.test.yml exec -T postgres \
            psql -U "$TEST_DB_USER" -d professional_management_test -tAc \
            "SELECT count(*) FROM databasechangelog")
          docker compose -f docker-compose.test.yml run --rm liquibase update
          after=$(docker compose -f docker-compose.test.yml exec -T postgres \
            psql -U "$TEST_DB_USER" -d professional_management_test -tAc \
            "SELECT count(*) FROM databasechangelog")
          echo "Changesets before: $before, after: $after"
          [ "$before" = "$after" ] \
            || { echo "Second update added changesets" >&2; exit 1; }

      - name: Verify expected changeset count
        env:
          TEST_DB_PASSWORD: ${{ steps.db_password.outputs.password }}
        run: |
          expected=27
          reported="${{ steps.fresh_count.outputs.count }}"
          if [ "$reported" != "$expected" ]; then
            echo "Expected $expected changesets in databasechangelog, got $reported" >&2
            exit 1
          fi
          echo "Fresh update applied exactly $expected changesets."

      - name: Liquibase validate
        env:
          TEST_DB_PASSWORD: ${{ steps.db_password.outputs.password }}
        run: docker compose -f docker-compose.test.yml run --rm liquibase validate

      - name: Liquibase rollback (all)
        # 999 is a temporary sentinel meaning "all". It will be replaced by a
        # rollback-to-tag once release tags are introduced under 04_tcl.
        env:
          TEST_DB_PASSWORD: ${{ steps.db_password.outputs.password }}
        run: docker compose -f docker-compose.test.yml run --rm liquibase rollback-count 999

      - name: Verify schema is empty after rollback
        env:
          TEST_DB_PASSWORD: ${{ steps.db_password.outputs.password }}
        run: |
          count=$(docker compose -f docker-compose.test.yml exec -T postgres \
            psql -U "$TEST_DB_USER" -d professional_management_test -tAc \
            "SELECT count(*) FROM information_schema.tables \
             WHERE table_schema NOT IN ('pg_catalog','information_schema') \
             AND table_type='BASE TABLE' \
             AND table_name NOT IN ('databasechangelog','databasechangeloglock')")
          echo "Domain tables remaining: $count"
          [ "$count" = "0" ] || { echo "Domain tables remain after rollback" >&2; exit 1; }

      - name: Liquibase update (reapply)
        env:
          TEST_DB_PASSWORD: ${{ steps.db_password.outputs.password }}
        run: docker compose -f docker-compose.test.yml run --rm liquibase update

      - name: Run seed rollback integration tests
        shell: pwsh
        env:
          TEST_DB_PASSWORD: ${{ steps.db_password.outputs.password }}
        run: |
          # The runner creates its own ephemeral PostgreSQL container
          # (docker network create + docker run), independently of the
          # compose service used by the steps above.
          pwsh -NoProfile -File ./tests/run-seed-rollback-tests.ps1

      - name: Run schema tests
        env:
          TEST_DB_PASSWORD: ${{ steps.db_password.outputs.password }}
        run: |
          docker compose -f docker-compose.test.yml exec -T -e PGPASSWORD="$TEST_DB_PASSWORD" \
            postgres psql -U "$TEST_DB_USER" -d professional_management_test \
            -X -v ON_ERROR_STOP=1 -f /tests/professional-schema-tests.sql

      - name: Cleanup
        if: always()
        env:
          TEST_DB_PASSWORD: ${{ steps.db_password.outputs.password }}
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: professional_management_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?TEST_DB_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ./tests/sql:/tests:ro

  liquibase:
    image: liquibase/liquibase:4.31
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /liquibase/changelog
    volumes:
      - ./db/changelog:/liquibase/changelog:ro
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/professional_management_test
      LIQUIBASE_COMMAND_USERNAME: test_user
      LIQUIBASE_COMMAND_PASSWORD: ${TEST_DB_PASSWORD:?TEST_DB_PASSWORD must be set}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.yaml

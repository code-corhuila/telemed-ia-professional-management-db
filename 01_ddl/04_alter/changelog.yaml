databaseChangeLog:
  # Historical changesets 005 and 006 use SQL files with inline rollback
  # (`--liquibase formatted sql`). Their checksums are frozen and their
  # rollbacks cannot be moved to external files without breaking every
  # environment that has already applied them.
  # New changesets 007 and 008 use YAML changeSet entries with sqlFile and
  # external rollbacks under 05_rollbacks/, as required by the database
  # standard for new migrations. Both mechanisms coexist by design.
  - include:
      file: 005-cascade-deleted-specialty-ownership.sql
      relativeToChangelogFile: true
      logicalFilePath: changes/005-cascade-deleted-specialty-ownership.sql
  - include:
      file: 006-add-professional-type-and-status.sql
      relativeToChangelogFile: true
  - changeSet:
      id: ddl-alter-007
      author: telemed
      comment: "Move Professional Management domain tables into their dedicated schema."
      changes:
        - sqlFile:
            path: 007_move_domain_tables_to_schema.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/007_move_domain_tables_to_schema.rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: ddl-alter-008
      author: telemed
      comment: "Align professional CHECK constraint names with the repository naming convention."
      changes:
        - sqlFile:
            path: 008_rename_check_constraints.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/008_rename_check_constraints.rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: ddl-alter-010
      author: telemed
      comment: "Rename UNIQUE constraints to the uq_ prefix required by the standard."
      changes:
        - sqlFile:
            path: 010_rename_unique_constraints.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/010_rename_unique_constraints.rollback.sql
            relativeToChangelogFile: true
  - changeSet:
      id: ddl-alter-011
      author: telemed
      comment: "Convert text columns from VARCHAR(n) to text with CHECK length constraints."
      changes:
        - sqlFile:
            path: 011_convert_varchar_to_text.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_alter/011_convert_varchar_to_text.rollback.sql
            relativeToChangelogFile: true
